name: Deploy to production

permissions:
  contents: read
  # Паспортный вход в комнату секретов КАРМАНа (ADR-0012, волна 2): job запрашивает
  # у GitHub подписанное удостоверение этого репозитория. Общей строки-пароля при
  # этом не существует нигде — ни в секретах, ни на боксе.
  id-token: write

# Сборка едет в CI (mandate brain 2026-06-11 про общий бокс): прод-бокс становится общим
# для нескольких проектов, on-box `next build` (6 ГБ heap + 8 ГБ swap) недопустим —
# build-спайк бьёт соседей (G20/G24). На сервер по SSH кладём готовый
# standalone-артефакт и рестартим systemd-сервис; бокс — runtime-only.
#
# Design-решение prerender↔БД (см. docs/plans/build-to-ci.md): `[slug]`-страницы
# статически пререндерятся на build из ЖИВОЙ прод-БД через SSH-туннель из job —
# та же семантика, что у прежнего on-box build, ноль stale-окна (#011).
#
# Требуется:
#   secrets.SSH_PRIVATE_KEY   — ключ деплоя (как раньше)
#   secrets.GONBA_BUILD_ENV   — dotenv для build: DATABASE_URL через туннель
#                               (127.0.0.1:15432), PAYLOAD_SECRET, NEXT_PUBLIC_* —
#                               последние ЗАПЕКАЮТСЯ в бандл при build.
#
# Стратегия на падение: НЕ откатываемся — выгружаем логи в job output и фейлим.
# Старый релиз продолжает работать (symlink releases/current не переключён либо
# переключён, но restart упал — тогда чинить руками). Hot-fix fallback: старый
# on-box `scripts/safe-build.sh` + юнит-бэкап (см. docs/plans/build-to-ci.md §Откат).

on:
  workflow_run:
    workflows: ['CI']
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      build_only:
        description: 'Только собрать артефакт в CI (без деплоя на бокс) — обкатка сборки'
        type: boolean
        default: false

concurrency:
  # Не параллелим деплои; если уже идёт — новый ждёт, не cancel предыдущий (G24)
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # При workflow_run запускаемся только если CI прошёл успешно
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
          # При workflow_run собираем именно тот коммит, что прошёл CI
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          # Адрес и пользователь бокса — секретами, а не литералами. Два мотива:
          # (1) репо публичный с 17.08, литерал в файле = recon-поверхность;
          # (2) раннер МАСКИРУЕТ значение секрета в любой строке лога прогона —
          #     включая сообщения самого ssh-клиента, которые фильтр дампа
          #     перехватить не может (замер 30.08: 112 вхождений хостнейма).
          SSH_HOST: ${{ secrets.GONBA_SSH_HOST }}
          SSH_USER: ${{ secrets.GONBA_SSH_USER }}
        run: |
          set -e
          if [ -z "${SSH_PRIVATE_KEY}" ]; then
            echo "::error::Secret SSH_PRIVATE_KEY не задан. См. docs/PROJECT.md → «Деплой / CI»."
            exit 1
          fi
          if [ -z "${SSH_HOST}" ] || [ -z "${SSH_USER}" ]; then
            echo "::error::Secrets GONBA_SSH_HOST / GONBA_SSH_USER не заданы. См. docs/PROJECT.md → «Деплой / CI»."
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${SSH_HOST}" >> ~/.ssh/known_hosts 2>/dev/null
          # Heredoc БЕЗ кавычек вокруг EOF — иначе ${SSH_HOST}/${SSH_USER}
          # попадут в конфиг буквально. Других `$` в блоке нет.
          cat > ~/.ssh/config <<EOF
          Host GONBA
            HostName ${SSH_HOST}
            Port 22
            User ${SSH_USER}
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 30
          EOF
          chmod 600 ~/.ssh/config

      - name: Гейт миграций — спрашиваем прод-БД, а не смотрим на файлы
        # Что охраняем: «схема прода не отстала от кода, который сейчас поедет».
        #
        # Прежний гейт проверял другое — есть ли в коммите НОВЫЙ файл миграции —
        # и падал на нём даже тогда, когда миграция уже применена. Признак «файл
        # новый» и охраняемое свойство совпадают не всегда, и расходятся они
        # ровно в рабочем случае: миграцию накатили руками, а гейт всё равно
        # валит деплой и требует ручной workflow_dispatch. Это класс #228 —
        # гейт, который не исполняет то, что охраняет.
        #
        # Теперь спрашиваем истину у самой БД: сверяем файлы миграций из
        # ДЕПЛОИМОГО коммита со строками `payload_migrations` на проде.
        #
        # Гейт фейлит ЗАКРЫТО: недоступна БД или пустой ответ — считаем, что
        # схема неизвестна, и не деплоим. Пропуска по workflow_dispatch больше
        # нет: он существовал как обещание «я применил руками», а теперь это
        # обещание проверяется, а не принимается на слово.
        run: |
          set -euo pipefail

          FILES=$(ls web/src/migrations/*.ts 2>/dev/null \
            | grep -v '/index\.ts$' \
            | xargs -r -n1 basename \
            | sed 's/\.ts$//' \
            | sort || true)

          if [ -z "${FILES}" ]; then
            echo "Файлов миграций нет — сверять нечего."
            exit 0
          fi

          # Падение ssh/psql роняет шаг (set -e на присваивании) — это и есть
          # «фейлить закрыто».
          # batch < 0 отбрасываем: Payload держит там служебную строку `dev` —
          # отметку о dev-режиме (push-схема), а не применённую миграцию. Она
          # живёт в этой БД с 19.05 и Payload сам её в порядке миграций не
          # учитывает; без фильтра гейт предупреждал бы про «прод впереди кода»
          # на каждом деплое и приучил бы не читать свои предупреждения.
          APPLIED=$(ssh -o BatchMode=yes GONBA \
            "sudo -u postgres psql -d gonba -t -A -c 'SELECT name FROM payload_migrations WHERE batch >= 0'" \
            | tr -d '\r' | sed '/^$/d' | sort)

          if [ -z "${APPLIED}" ]; then
            echo "::error::Таблица payload_migrations на проде пуста или недоступна — состояние схемы неизвестно, не деплоим."
            exit 1
          fi

          MISSING=$(comm -23 <(printf '%s\n' "${FILES}") <(printf '%s\n' "${APPLIED}") || true)

          if [ -n "${MISSING}" ]; then
            echo "::error::Схема прода отстала от кода — эти миграции есть в коммите, но НЕ применены на проде:"
            printf '  %s\n' ${MISSING}
            echo ""
            echo "Применить (по одной, с проверкой):"
            echo "  ssh GONBA 'sudo -u postgres psql -d gonba -v ON_ERROR_STOP=1' < web/src/migrations/<имя>.sql"
            echo "  ssh GONBA \"sudo -u postgres psql -d gonba -c \\\"INSERT INTO payload_migrations (name, batch, updated_at, created_at) VALUES ('<имя>', <max(batch)+1>, now(), now());\\\"\""
            echo ""
            echo "После этого достаточно перезапустить ЭТОТ прогон — гейт увидит применённые миграции сам."
            exit 1
          fi

          # Обратный случай не фатален, но о нём стоит знать: на проде применено
          # то, чего в коде нет (откатили файл, деплоим старый коммит).
          EXTRA=$(comm -13 <(printf '%s\n' "${FILES}") <(printf '%s\n' "${APPLIED}") || true)
          if [ -n "${EXTRA}" ]; then
            echo "::warning::На проде применены миграции, которых нет в этом коммите (прод впереди кода):"
            printf '  %s\n' ${EXTRA}
          fi

          echo "Все $(printf '%s\n' "${FILES}" | wc -l) миграций кода применены на проде — продолжаем."

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          # Node 20 = версия рантайма на боксе (/usr/bin/node v20.x) — артефакт
          # собирается тем же мажором, что его исполняет.
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install deps
        # Канонический lockfile репо — package-lock.json (npm), как в ci.yml:
        # pnpm-lock.yaml в .gitignore и в репо отсутствует (урок первого CI-деплоя).
        working-directory: web
        run: npm ci

      - name: Write build env (secret GONBA_BUILD_ENV)
        # Содержимое dotenv: DATABASE_URL=postgresql://…@127.0.0.1:15432/gonba (через
        # SSH-туннель), PAYLOAD_SECRET, NEXT_PUBLIC_SERVER_URL, PAYLOAD_PUBLIC_SERVER_URL.
        # NEXT_PUBLIC_* запекаются в клиентский бандл здесь, на build (наша же грабля —
        # см. playbook §5.2). Источник значений — /etc/gonba/gonba.env на боксе.
        env:
          GONBA_BUILD_ENV: ${{ secrets.GONBA_BUILD_ENV }}
        run: |
          set -e
          if [ -z "${GONBA_BUILD_ENV}" ]; then
            echo "::error::Secret GONBA_BUILD_ENV не задан — build без БД/доменов невозможен."
            exit 1
          fi
          printf '%s\n' "${GONBA_BUILD_ENV}" > web/.env
          grep -q '127\.0\.0\.1:15432' web/.env || {
            echo "::error::GONBA_BUILD_ENV: DATABASE_URL должен ходить через туннель 127.0.0.1:15432"
            exit 1
          }

      - name: Open SSH tunnel to prod Postgres
        # Prerender читает живую прод-БД (read-only: push:true гейтится NODE_ENV, G20).
        run: |
          set -e
          ssh -f -N -o ExitOnForwardFailure=yes -L 15432:127.0.0.1:5432 GONBA
          # smoke коннекта через туннель с ретраями. ssh -f форкается в фон сразу
          # после установки форварда, но pg_isready вплотную за ним иногда гонит
          # готовность форварда → спорадический «no response» (фейл деплоя 2026-06-13;
          # SSH/Postgres были живы, дамп-журналов-степ через тот же SSH прошёл).
          ok=
          for i in $(seq 1 10); do
            if pg_isready -h 127.0.0.1 -p 15432 >/dev/null 2>&1; then
              echo "tunnel ready (attempt $i)"; ok=1; break
            fi
            sleep 2
          done
          [ "$ok" = 1 ] || { echo "::error::Postgres за туннелем недоступен (10×2с)"; exit 1; }

      - name: Build (standalone, prerender из прод-БД)
        working-directory: web
        env:
          NODE_ENV: production
          # Включает output:'standalone' в next.config.js. Локально флаг НЕ ставят —
          # standalone-сборка мутирует node_modules (G41).
          STANDALONE_BUILD: '1'
        run: npm run build:raw

      - name: Close SSH tunnel
        if: always()
        run: pkill -f 'ssh -f -N.*15432' || true

      - name: Assemble standalone bundle
        working-directory: web
        run: |
          set -e
          if [ ! -f .next/standalone/server.js ]; then
            echo "::error::server.js не в корне .next/standalone — проверь outputFileTracingRoot/STANDALONE_BUILD"
            find .next/standalone -maxdepth 3 -name server.js || true
            exit 1
          fi
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          # build-env с секретами в артефакт не кладём: runtime берёт env из
          # /etc/gonba/gonba.env (systemd EnvironmentFile), NEXT_PUBLIC_* уже запечены
          rm -f .next/standalone/.env
          tar czf ../gonba-app.tgz -C .next/standalone .
          echo "bundle: $(du -h ../gonba-app.tgz | cut -f1)"

      - name: Stop here if build_only
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_only }}
        run: echo "build_only=true — артефакт собран успешно, деплой пропущен."

      - name: Pull latest main on prod (репо бокса — для таймеров/скриптов/юнита)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.build_only) }}
        run: |
          EXPECTED_SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          ssh GONBA "set -e; cd /home/valstan/GONBA; git pull --ff-only origin main; test \"\$(git rev-parse HEAD)\" = \"$EXPECTED_SHA\""

      - name: Refresh box node_modules if lockfile changed (для vk-sync/media-cache таймеров)
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: |
          set -e
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- web/package-lock.json || true)
          if [ -n "${CHANGED}" ]; then
            echo "package-lock.json изменился — обновляем node_modules на боксе (таймеры/скрипты)…"
            ssh GONBA "cd /home/valstan/GONBA/web && npm install --no-audit --no-fund 2>&1 | tail -5"
          else
            echo "lockfile не менялся — install на боксе пропущен."
          fi

      - name: Доставить секреты из комнаты КАРМАНа в /etc/gonba/gonba.env
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.build_only) }}
        run: |
          set -euo pipefail
          # Удостоверение живёт минуты и одноразово (КАРМАН отбивает повтор jti).
          ASSERTION="$(curl -sS --max-time 15             -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=karman-vault" | jq -r '.value // empty')"
          if [ -z "$ASSERTION" ]; then
            echo "::warning::не удалось получить OIDC-удостоверение — доставка секретов пропущена"
            exit 0
          fi
          # Через stdin, а не аргументом: аргументы видны в `ps` на общем боксе.
          # Обмен и чтение комнаты идут НА БОКСЕ — КАРМАН слушает loopback, и
          # значения секретов в раннер не попадают вовсе.
          printf '%s' "$ASSERTION"             | ssh GONBA 'sudo /home/valstan/GONBA/scripts/pull-secrets-from-vault.sh'

      - name: Ship artifact + install unit + restart
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.build_only) }}
        run: |
          set -e
          scp -q gonba-app.tgz GONBA:/tmp/gonba-app.tgz
          ssh GONBA 'bash -s' "${{ github.event.workflow_run.head_sha || github.sha }}" <<'REMOTE'
          set -e
          SHA="$1"
          BASE=/home/valstan/GONBA
          REL="$BASE/releases/$SHA"
          rm -rf "$REL"; mkdir -p "$REL"
          tar xzf /tmp/gonba-app.tgz -C "$REL"
          rm -f /tmp/gonba-app.tgz
          ln -sfn "$REL" "$BASE/releases/current"
          # Юнит ставится идемпотентно из репо ПЕРЕД restart — юнит и артефакт
          # приезжают атомарно одним деплоем (первый CI-деплой = cutover со старого
          # on-box юнита). Бэкап старого юнита снят заранее (gonba.service.bak-*).
          if ! cmp -s "$BASE/deploy/systemd/gonba.service" /etc/systemd/system/gonba.service; then
            sudo cp "$BASE/deploy/systemd/gonba.service" /etc/systemd/system/gonba.service
            sudo systemctl daemon-reload
            echo "unit обновлён из репо"
          fi
          sudo systemctl restart gonba
          # держим последние 3 релиза
          ls -1dt "$BASE"/releases/*/ 2>/dev/null | grep -v '/current/$' | tail -n +4 | xargs -r rm -rf
          echo "deployed $SHA"
          REMOTE

      - name: Smoke checks — local /api/health
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.build_only) }}
        run: |
          set -e
          sleep 6
          STATUS=$(ssh GONBA "curl -s -o /dev/null -w '%{http_code}' --max-time 15 http://127.0.0.1:3000/api/health")
          echo "local /api/health: ${STATUS}"
          [ "${STATUS}" = "200" ] || { echo "::error::local /api/health = ${STATUS}, ожидался 200"; exit 1; }

      - name: Smoke checks — public CDN
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.build_only) }}
        run: |
          set -e
          BASE='https://xn--80abf4be9f.xn--p1ai'
          for path in / /api/health /admin; do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${BASE}${path}")
            echo "CDN ${path}: ${STATUS}"
            [ "${STATUS}" = "200" ] || { echo "::error::CDN ${path} = ${STATUS}, ожидался 200"; exit 1; }
          done
          PROJECTS_HEADERS=$(curl -sS -D - -o /dev/null --max-time 20 "${BASE}/projects" | tr -d '\r')
          PROJECTS_STATUS=$(printf '%s\n' "${PROJECTS_HEADERS}" | awk 'NR == 1 { print $2 }')
          PROJECTS_LOCATION=$(printf '%s\n' "${PROJECTS_HEADERS}" | awk 'tolower($1) == "location:" { print $2 }')
          echo "CDN /projects: ${PROJECTS_STATUS} → ${PROJECTS_LOCATION}"
          [ "${PROJECTS_STATUS}" = "308" ] && [ "${PROJECTS_LOCATION}" = "/#projects" ] || {
            echo "::error::CDN /projects должен постоянно перенаправлять на /#projects"
            exit 1
          }

      - name: Smoke checks — контент-маркер на / (anti-stale-prerender)
        # Lesson 2026-05-30: HTTP 200 != правильная страница (#011). Проверяем маркер
        # актуального компонента главной в ответе локального эндпоинта (минует CDN).
        # Если главная меняется по дизайну — ОБНОВИТЬ MARKER.
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.build_only) }}
        run: |
          set -e
          MARKER='id="projects"'   # единая витрина проектов на главной
          BODY=$(ssh GONBA "curl -s --max-time 20 http://127.0.0.1:3000/")
          COUNT=$(printf '%s' "${BODY}" | grep -o "${MARKER}" | wc -l | tr -d ' ')
          echo "Маркер '${MARKER}' на / (local): ${COUNT} вхождений"
          if [ "${COUNT}" -lt 1 ]; then
            echo "::error::На / нет маркера '${MARKER}' — вероятно отдан УСТАРЕВШИЙ prerender, хотя код был 200. Деплой НЕуспешен."
            exit 1
          fi
          echo "OK: главная отдаёт актуальную витрину проектов (не stale)."

      - name: On failure — дамп журналов прода
        if: failure()
        run: |
          # ⚠️ Лог прогона ПУБЛИЧЕН (репо public с 17.08). Дамп журнала — вторая
          # recon-поверхность: `journalctl` префиксует КАЖДУЮ строку хостнеймом,
          # `systemctl status` печатает путь юнита в `Loaded:`. Замер 30.08 по
          # настоящему логу упавшего прогона 32898071103: 112 вхождений хостнейма.
          # Поэтому весь вывод проходит через маскировку, а её значения
          # ВЫЧИСЛЯЮТСЯ НА БОКСЕ (`hostname`, `$HOME`) и в этот файл не попадают —
          # иначе фильтр сам опубликовал бы то, что скрывает. См. письмо brain
          # 2026-08-29-vars-print-in-public-logs и docs/PENDING_FOLLOWUPS.md.
          # Строки ниже в ОДИНАРНЫХ кавычках: локальный шелл их не трогает,
          # `$(hostname -f)` и `$HOME` раскрывает удалённый шелл на боксе.
          # `-f` идёт ПЕРЕД `-s`: короткое имя — префикс FQDN, и обратный порядок
          # оставил бы в логе хвост `.vps.<хостер>.ru` (поймано приёмкой 30.08).
          #
          # ⚠️ ЧЕСТНАЯ ГРАНИЦА: маскировка чистит только stdout УДАЛЁННОЙ команды.
          # Сообщения самого ssh-клиента («connect to host … timed out») печатает
          # раннер, они идут мимо sed — а появляются они ровно тогда, когда этот
          # шаг и срабатывает. Полностью закрывает только перевод хоста в GitHub
          # secret: раннер маскирует значение секрета в ЛЮБОЙ строке лога.
          # См. docs/PENDING_FOLLOWUPS.md → «Хостнеймы остались рабочими дефолтами».
          echo "=== journalctl -u gonba (последние 100 строк, без префикса хоста) ==="
          ssh GONBA 'sudo journalctl -u gonba -n 100 --no-pager -o cat | sed -e "s/$(hostname -f)/<host>/g" -e "s/$(hostname -s)/<host>/g" -e "s#$HOME#<home>#g"' 2>&1 || true
          echo ""
          echo "=== состояние юнита (без Loaded: — он печатает путь юнита) ==="
          ssh GONBA 'systemctl is-active gonba; systemctl show gonba -p ActiveState -p SubState -p Result -p ExecMainStatus -p NRestarts' 2>&1 || true
          echo ""
          echo "=== releases на боксе ==="
          ssh GONBA 'ls -la "$HOME"/GONBA/releases/ 2>/dev/null | sed -e "s#$HOME#<home>#g"' 2>&1 || true
