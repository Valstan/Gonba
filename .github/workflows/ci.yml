name: CI

permissions:
  contents: read

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  web-quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gonba_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gonba_ci
      PAYLOAD_SECRET: ci-secret-not-for-production
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      PAYLOAD_PUBLIC_SERVER_URL: http://localhost:3000
      CRON_SECRET: ci-cron-secret
      PREVIEW_SECRET: ci-preview-secret
      IP_HASH_SALT: ci-ip-hash-salt
    defaults:
      run:
        working-directory: web
        # bash = `bash -eo pipefail {0}`: дефолтный шелл Actions зовёт
        # `bash -e {0}` без pipefail (G322) — код конвейера = код последнего
        # звена. Все шаги джобы — одиночные команды npm, но правило должно
        # действовать и на следующий добавленный шаг (тот же долг, что закрыт
        # в deploy-prod.yml).
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Сканер секретов — шаг ВНУТРИ required-джобы `web-quality`, поэтому
      # branch protection применяет его без отдельной настройки required checks.
      # Стоит до `npm ci`: чистый checkout = ровно отслеживаемые файлы (ни
      # node_modules, ни .next, ни .env), и красный гейт не ждёт полной сборки.
      # Правила и обоснование формы — .gitleaks.toml.
      - name: Secret scan (gitleaks)
        working-directory: ${{ github.workspace }}
        env:
          GITLEAKS_VERSION: 8.28.0
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version
          /tmp/gitleaks dir . \
            --config .gitleaks.toml \
            --no-banner \
            --redact \
            --report-format sarif \
            --report-path /tmp/gitleaks.sarif

      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-sarif
          path: /tmp/gitleaks.sarif
          if-no-files-found: ignore

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: npm ci

      - name: Generate Payload types
        run: npm run generate:types

      - name: Generate Payload import map
        run: npm run generate:importmap

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Integration tests
        run: npm run test:int

      - name: Generate Payload import map — гейт на артефакт ДО сборки
        # Тот же молчащий шаг, что ронял деплой (30.09, 11.10): генератор
        # мог выйти 0 и не записать файл, а next build умирал ниже. Гейт на
        # результат шага СРАЗУ — красный шаг секунд за 10 вместо 3-минутной
        # сборки. Симптом «Can't resolve '../importMap'» после этого шага
        # означает уже другую причину.
        run: |
          set -eo pipefail
          npm run generate:importmap
          if [ ! -s "src/app/(payload)/admin/importMap.js" ]; then
            echo "::error::importMap.js не создан или пуст — payload generate:importmap отработал вхолостую"
            exit 1
          fi
          echo "importMap.js до сборки: $(wc -c < "src/app/(payload)/admin/importMap.js") байт"

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E smoke tests
        env:
          E2E_TEST_SECRET: local-e2e-secret
        run: npx playwright test tests/e2e/frontend.e2e.spec.ts --config=playwright.config.ts --project=chromium --reporter=line
