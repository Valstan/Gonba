# GONBA: запас прочности для sshd под постоянным потоком сканеров.
#
# Установка: файл кладётся в /etc/ssh/sshd_config.d/20-gonba-load.conf
#   sudo install -m 0644 20-gonba-load.conf /etc/ssh/sshd_config.d/
#   sudo sshd -t && sudo systemctl reload ssh
# Откат: sudo rm /etc/ssh/sshd_config.d/20-gonba-load.conf && sudo systemctl reload ssh
# Подробности — docs/plans/opencode-web-on-prod.md, раздел «sshd под сканерами».
#
# Честная рамка: это НЕ лечение найденной поломки. Замер 18.10.2026 показал, что
# задержки входа (11 и более секунд) давал старый клиент openssh на Windows —
# OpenSSH 7.7p1 из C:\Windows\System32\OpenSSH против 1,2 с у клиента 10.5p1.
# Отказов входа из-за лимитов sshd мы ни разу не поймали. Но порт 22 живёт под
# сканерами — 4385 неудачных попыток и 426 банов за 8 суток, в один момент
# 69–81 соединение в SYN-RECV, — а дефолтный maxstartups 10:30:100 разрешает
# всего 10 неавторизованных сессий, и тогда живой вход отбивается ДО проверки
# ключа. Поэтому запас поднят, но не «на всякий случай побольше»:
#   сессия до авторизации занимает ~3 МБ, 150 таких — ~450 МБ при полном
#   заполнении (на боксе 1973 МБ, из них ~830 доступно). Вариант 100:30:200
#   из письма brain отвергнут: 200 — это ~600 МБ, и на 1-ядерной машине
#   такое соседство уже теснит gonba/Postgres/nginx.
MaxStartups 50:30:150

# LoginGraceTime 120 → 45: неавторизованная сессия держит слот меньше времени,
# значит под всплеском сканеров слоты освобождаются втрое быстрее.
# Нашему входу (ключ, ~1 с) и деплою 45 секунд с большим запасом.
LoginGraceTime 45

# Чего здесь СОЗНАТЕЛЬНО нет:
#  * PerSourceMaxStartups (например 8 на источник) — соблазнительно, но наш вход
#    и деплой идут с общих адресов: CGNAT провайдера владельца и раннеры GitHub.
#    Сканер-сосед по тому же адресу выберет лимит и отобьёт живой вход — риск
#    залочиться выше выгоды.
#  * Правки fail2ban — 10 минут и 5 попыток уже дают 426 банов за 8 суток,
#    и удлинение бана бьёт по владельцу с динамическим IP раньше, чем по
#    сканерам. Выгоды не замерено, поэтому не трогаем.
