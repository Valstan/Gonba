# Настройки набора GONBA. Не секретные значения.
# D-038: адреса бокса здесь НЕТ и не будет — соединение идёт по алиасу `GONBA`
# из ~/.ssh/config этой машины (на новой машине алиас заводит владелец).

SSH_ALIAS=GONBA

# Локальный порт туннеля чата (у es-vps 14976, у Сарафана 14975 — не пересекаемся).
CHAT_LOCAL_PORT=14974

# Порт движка OpenCode на боксе (loopback, в юните opencode-web.service).
ENGINE_PORT=49374
